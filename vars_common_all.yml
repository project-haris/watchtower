#sysctl
vars_common_all_sysctl_items:
  - name: net.ipv6.conf.all.disable_ipv6
    value: "1"
    file: 98-disable_ipv6.conf
  - name: net.ipv6.conf.default.disable_ipv6
    value: "1"
    file: 98-disable_ipv6.conf
  - name: net.ipv6.conf.lo.disable_ipv6
    value: "1"
    file: 98-disable_ipv6.conf

vars_common_all_sshd:
  # Logging and Connection
  SyslogFacility: "AUTHPRIV"
  LogLevel: "INFO"
  AddressFamily: "inet"
  UseDNS: "no"
  # Authentication
  PermitRootLogin: "prohibit-password"
  PubkeyAuthentication: "yes"
  AuthorizedKeysFile: "/etc/AuthorizedKeys/%u"
  #PasswordAuthentication: "yes"
  ChallengeResponseAuthentication: "no"
  # Kerberos / GSSAPI
  GSSAPIAuthentication: "no"
  GSSAPICleanupCredentials: "no"
  KerberosAuthentication: "no" 
  # Access Control
  AllowGroups: "admin root" 
  # Features and Environment
  X11Forwarding: "yes"
  UsePAM: "yes"
  PrintMotd: "no"
  AcceptEnv: >-
    LANG LC_CTYPE LC_NUMERIC LC_TIME LC_COLLATE LC_MONETARY LC_MESSAGES
    LC_PAPER LC_NAME LC_ADDRESS LC_TELEPHONE LC_MEASUREMENT
    LC_IDENTIFICATION LC_ALL LANGUAGE XMODIFIERS  
  # Timeouts
  ClientAliveInterval: 30
  ClientAliveCountMax: 2

manage_hostname: true
hostname: "{{ inventory_hostname }}.tailb05740.ts.net"
manage_resolv: true
searchdomain: "tailb05740.ts.net"
nameservers:
