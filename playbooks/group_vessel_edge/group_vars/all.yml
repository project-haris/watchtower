#ansible_python_interpreter: /usr/bin/python3

# systctl
sysctl_items: "{{ vars_common_all_sysctl_items }}"
soft_packages_latest: "{{ vars_common_all_packages_apt }}"
# sshd
users_auth_keys_etc: true
sshd: "{{ vars_common_all_sshd }}"

# Users
users: "{{ vars_common_all_root_user + vars_common_all_admin_users }}"
users_deleted: "{{ vars_common_all_users_deleted }}"

tailscale_args: "--ssh"
auth_key_in_state: false
chrony_timezone: "Europe/Tallinn"

zabbix_repository_version: "7.0"
agent_variant: 2
agent_major_version: "7.0"
agent_apply_firewalld_rule: false
agent_param_server: "{{vars_common_all_zabbix_server}}"
agent_param_serveractive: "{{vars_common_all_zabbix_server}}"
agent_param_hostname: "{{ inventory_hostname }}"
haris_signalk_port: 3000
kibana_port: 5601
haris_soc_forward_enabled: false
haris_soc_log_host: "haris-citadel"
haris_soc_log_port: 5045
haris_filebeat_enabled: true
haris_filebeat_logstash_host: "haris-citadel"
haris_filebeat_logstash_port: 5044

firewalld_config:
  DefaultZone: drop

firewalld_zones:
  - name: tailscale
    target: ACCEPT
    interface:
      - name: tailscale0
    service:
      - name: ssh
    port:
      - port: "{{ haris_signalk_port }}"
        protocol: tcp
      - port: "{{ kibana_port }}"
        protocol: tcp
      - port: 10050
        protocol: tcp
      - port: 9200
        protocol: tcp

# cron
cron_service_enabled: yes
cron_service_state: started
cron_tasks: "{{ vars_common_all_cron_clean_tmp_montly }}"

etc_bashrc_entries:
  - "HISTSIZE=10000"
  - "HISTFILESIZE=20000"
  - "alias ll='ls -lart --color=auto'"
  - "alias grep='grep --color=auto'"
  - "shopt -s histappend"
  - "export EDITOR=vim"
  - "export VISUAL=vim"
