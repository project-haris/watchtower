- name: PLAYBOOK FOR GROUP 'MSOC core nodes'
  hosts: msoc_core
  remote_user: ansible
  become: true
  vars:
    ansible_become_method: sudo
  vars_files:
    - ../../vars_common_all.yml
    - ../../vars_disabled_roles.yml
    - ../../vars_common_keys.yml
    - ../../vars_common_secrets.yml

  roles:
    - { role: sysctl, tags: [sysctl], when: not (disabled_roles.sysctl | default(false))}
    - { role: users_groups, tags: [users_groups], when: not (disabled_roles.users_groups | default(false)) }
    - { role: sshd, tags: [sshd], when: not (disabled_roles.sshd | default(false)) }   
    - { role: soft_yum, tags: [soft, soft_yum], when: not (disabled_roles.soft_yum | default(false)) }
    - { role: firewalld, tags: [firewalld], when: not (disabled_roles.firewalld | default(false)) }
    - { role: resolv_hosts, tags: [resolv_hosts], when: not (disabled_roles.resolv_hosts | default(false)) }
    - { role: artis3n.tailscale.machine, tags: [tailscale], when: not (disabled_roles.tailscale | default(false)) }
    - { role: cron, tags: [cron], when: not (disabled_roles.cron | default(false)) }
    - { role: chrony, tags: [chrony], when: not (disabled_roles.chrony | default(false)) }
    - { role: zabbix_agent, tags: [zabbix, zabbix_agent], when: not (disabled_roles.zabbix_agent | default(false)) }
    - { role: zabbix_server, tags: [zabbix, zabbix_server], when: (haris_install_zabbix_server | default(false)) and not (disabled_roles.zabbix_server | default(false)) }
    - { role: elk_stack, tags: [elk_stack], when: (haris_install_elk_stack | default(false)) and not (disabled_roles.elk_stack | default(false)) }
    - { role: docker, tags: [docker], when: haris_install_docker | default(false) }
