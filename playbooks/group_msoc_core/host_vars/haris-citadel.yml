haris_install_elk_stack: true
haris_install_zabbix_server: true
elasticsearch_cluster_name: "haris-cluster"
elasticsearch_node_name: "haris-citadel"
# firewalld_rules:
#   - zone: public
#     port: 5045/tcp
#     permanent: true
#     immediate: true
#     state: enabled

agent_param_server: "127.0.0.1"
agent_param_serveractive: "127.0.0.1"

firewalld_config:
  DefaultZone: drop

firewalld_zones:
  - name: tailscale
    target: ACCEPT
    interface:
      - name: tailscale0
    service:
      - name: ssh
    port:
      - port: 80
        protocol: tcp
      - port: 10050
        protocol: tcp
      - port: 10051
        protocol: tcp
      - port: "{{ kibana_port }}"
        protocol: tcp
      - port: 9200
        protocol: tcp
      - port: "{{ logstash_signalk_port }}"
        protocol: tcp
