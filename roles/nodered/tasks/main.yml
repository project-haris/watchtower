- name: Validate supported Node-RED platform
  ansible.builtin.assert:
    that:
      - ansible_os_family == 'Debian'
    fail_msg: "nodered currently supports Debian-based systems only."

- name: Ensure Node-RED install user exists
  ansible.builtin.command:
    cmd: "getent passwd {{ nodered_user }}"
  register: nodered_user_lookup
  changed_when: false
  failed_when: nodered_user_lookup.rc != 0

- name: Set Node-RED install user home
  ansible.builtin.set_fact:
    nodered_user_home: "{{ nodered_user_lookup.stdout.split(':')[5] }}"

- name: Install Node-RED prerequisites
  ansible.builtin.apt:
    name: "{{ nodered_prerequisite_packages }}"
    state: present
    update_cache: true

- name: Download official Node-RED installer
  ansible.builtin.get_url:
    url: "{{ nodered_script_url }}"
    dest: "{{ nodered_script_path }}"
    owner: root
    group: root
    mode: "0755"

- name: Check whether Node-RED is already installed
  ansible.builtin.command:
    cmd: node-red --version
  register: nodered_version_check
  changed_when: false
  failed_when: false

- name: Build Node-RED installer arguments
  ansible.builtin.set_fact:
    nodered_installer_args:
      - --confirm-install
      - "{{ '--confirm-pi' if nodered_install_pi_nodes else '--skip-pi' }}"
      - "{{ '--node' ~ nodered_nodejs_major }}"

- name: Run official Node-RED installer
  ansible.builtin.command:
    argv: "{{ ['bash', nodered_script_path] + nodered_installer_args }}"
  become: true
  become_user: "{{ nodered_user }}"
  environment:
    HOME: "{{ nodered_user_home }}"
    USER: "{{ nodered_user }}"
    LOGNAME: "{{ nodered_user }}"
    TERM: dumb
  register: nodered_install
  when: nodered_force_reinstall or nodered_version_check.rc != 0
  changed_when: true

- name: Ensure Node-RED service is enabled
  ansible.builtin.systemd:
    name: "{{ nodered_service_name }}"
    enabled: true
  when: nodered_enable_service

- name: Ensure Node-RED service is running
  ansible.builtin.systemd:
    name: "{{ nodered_service_name }}"
    state: started
  when: nodered_start_service
