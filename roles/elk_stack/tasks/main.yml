- name: Validate ELK security secrets
  ansible.builtin.assert:
    that:
      - elasticsearch_elastic_password | length > 0
      - kibana_system_password | length > 0
      - logstash_internal_password | length > 0
      - kibana_encrypted_saved_objects_encryption_key | length > 0
      - kibana_security_encryption_key | length > 0
      - kibana_reporting_encryption_key | length > 0
    fail_msg: "When elasticsearch_security_enabled is true, set the Elastic, Kibana, Logstash, and Kibana encryption secrets."
  when: elasticsearch_security_enabled | bool

- name: Validate supported ELK platforms
  ansible.builtin.assert:
    that:
      - ansible_os_family in ['Debian', 'RedHat']
    fail_msg: "elk_stack currently supports only Debian/Ubuntu and Rocky/RedHat family hosts."

- name: Configure Elastic apt repository
  when: ansible_os_family == 'Debian'
  block:
    - name: Ensure keyrings directory exists
      ansible.builtin.file:
        path: /usr/share/keyrings
        state: directory
        mode: '0755'

    - name: Download Elastic GPG key
      ansible.builtin.get_url:
        url: https://artifacts.elastic.co/GPG-KEY-elasticsearch
        dest: /usr/share/keyrings/elastic-keyring.asc
        mode: '0644'

    - name: Dearmor Elastic GPG key
      ansible.builtin.command:
        cmd: gpg --dearmor -o /usr/share/keyrings/elastic-archive-keyring.gpg /usr/share/keyrings/elastic-keyring.asc
      args:
        creates: /usr/share/keyrings/elastic-archive-keyring.gpg

    - name: Add Elastic apt repository
      ansible.builtin.apt_repository:
        repo: "deb [signed-by=/usr/share/keyrings/elastic-archive-keyring.gpg] https://artifacts.elastic.co/packages/{{ elasticsearch_version }}/apt stable main"
        state: present
        filename: elastic-{{ elasticsearch_version }}
        update_cache: true

- name: Configure Elastic yum repository
  when: ansible_os_family == 'RedHat'
  block:
    - name: Add Elastic yum repository
      ansible.builtin.yum_repository:
        name: "elastic-{{ elasticsearch_version }}"
        description: "Elastic repository for {{ elasticsearch_version }}"
        baseurl: "https://artifacts.elastic.co/packages/{{ elasticsearch_version }}/yum"
        enabled: true
        gpgcheck: true
        gpgkey: "https://artifacts.elastic.co/GPG-KEY-elasticsearch"

- name: Install Elasticsearch on Debian
  ansible.builtin.apt:
    name: elasticsearch
    state: present
  when: ansible_os_family == 'Debian'

- name: Install Elasticsearch on RedHat
  ansible.builtin.yum:
    name: elasticsearch
    state: present
  when: ansible_os_family == 'RedHat'

- name: Configure Elasticsearch JVM Heap
  lineinfile:
    path: /etc/elasticsearch/jvm.options
    regexp: '^-Xms'
    line: "-Xms{{ elasticsearch_heap_size }}"
  notify: Restart Elasticsearch

- name: Configure Elasticsearch JVM Heap Max
  lineinfile:
    path: /etc/elasticsearch/jvm.options
    regexp: '^-Xmx'
    line: "-Xmx{{ elasticsearch_heap_size }}"
  notify: Restart Elasticsearch

- name: Deploy Elasticsearch Config
  template:
    src: elasticsearch.yml.j2
    dest: /etc/elasticsearch/elasticsearch.yml
  notify: Restart Elasticsearch

- name: Set Elasticsearch bootstrap password in keystore
  ansible.builtin.command:
    cmd: /usr/share/elasticsearch/bin/elasticsearch-keystore add -f -x bootstrap.password
    stdin: "{{ elasticsearch_bootstrap_password }}"
  no_log: true
  notify: Restart Elasticsearch
  when: elasticsearch_security_enabled | bool

- name: Install Logstash on Debian
  ansible.builtin.apt:
    name: logstash
    state: present
  when: ansible_os_family == 'Debian'

- name: Install Logstash on RedHat
  ansible.builtin.yum:
    name: logstash
    state: present
  when: ansible_os_family == 'RedHat'

- name: Deploy Logstash Pipeline Config
  template:
    src: logstash.conf.j2
    dest: "{{ logstash_conf_dir }}/pipeline.conf"
  notify: Restart Logstash

- name: Install Kibana on Debian
  ansible.builtin.apt:
    name: kibana
    state: present
  when: ansible_os_family == 'Debian'

- name: Install Kibana on RedHat
  ansible.builtin.yum:
    name: kibana
    state: present
  when: ansible_os_family == 'RedHat'

- name: Deploy Kibana Config
  template:
    src: kibana.yml.j2
    dest: /etc/kibana/kibana.yml
  notify: Restart Kibana

- name: Flush handlers before configuring ELK security
  ansible.builtin.meta: flush_handlers

- name: Ensure Elasticsearch is reachable
  ansible.builtin.uri:
    url: http://localhost:9200
    method: GET
    status_code:
      - 200
      - 401
  register: elasticsearch_health
  retries: 30
  delay: 5
  until: elasticsearch_health.status in [200, 401]
  when: elasticsearch_security_enabled | bool

- name: Set elastic user password
  ansible.builtin.uri:
    url: http://localhost:9200/_security/user/elastic/_password
    method: POST
    user: elastic
    password: "{{ elasticsearch_bootstrap_password }}"
    force_basic_auth: true
    body_format: json
    body:
      password: "{{ elasticsearch_elastic_password }}"
    status_code: 200
  no_log: true
  when: elasticsearch_security_enabled | bool

- name: Set kibana_system password
  ansible.builtin.uri:
    url: http://localhost:9200/_security/user/kibana_system/_password
    method: POST
    user: elastic
    password: "{{ elasticsearch_elastic_password }}"
    force_basic_auth: true
    body_format: json
    body:
      password: "{{ kibana_system_password }}"
    status_code: 200
  no_log: true
  when: elasticsearch_security_enabled | bool

- name: Create Logstash writer role
  ansible.builtin.uri:
    url: http://localhost:9200/_security/role/logstash_writer
    method: POST
    user: elastic
    password: "{{ elasticsearch_elastic_password }}"
    force_basic_auth: true
    body_format: json
    body:
      cluster:
        - manage_index_templates
        - monitor
      indices:
        - names:
            - "logstash-*"
          privileges:
            - write
            - create
            - create_index
            - auto_configure
    status_code: 200
  no_log: true
  when: elasticsearch_security_enabled | bool

- name: Create Logstash internal user
  ansible.builtin.uri:
    url: "http://localhost:9200/_security/user/{{ logstash_internal_username }}"
    method: POST
    user: elastic
    password: "{{ elasticsearch_elastic_password }}"
    force_basic_auth: true
    body_format: json
    body:
      password: "{{ logstash_internal_password }}"
      roles:
        - logstash_writer
      full_name: "Internal Logstash writer"
    status_code: 200
  no_log: true
  when: elasticsearch_security_enabled | bool

- name: Start and Enable ELK Services
  service:
    name: "{{ item }}"
    state: started
    enabled: yes
  loop:
    - elasticsearch
    - logstash
    - kibana
