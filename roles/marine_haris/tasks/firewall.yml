- name: Disable UFW if present (firewalld will replace it)
  service:
    name: ufw
    state: stopped
    enabled: false
  ignore_errors: true
  when: ansible_os_family == "Debian"

- name: Create custom Tailscale zone
  command: firewall-cmd --permanent --new-zone={{ haris_firewalld_tailscale_zone }}
  register: create_zone
  changed_when: create_zone.rc == 0
  failed_when: create_zone.rc != 0 and 'already exists' not in create_zone.stderr

- name: Add Tailscale interface to zone
  command: firewall-cmd --permanent --zone={{ haris_firewalld_tailscale_zone }} --add-interface=tailscale0
  register: add_interface
  changed_when: add_interface.rc == 0

- name: Set Tailscale zone target to ACCEPT
  command: firewall-cmd --permanent --zone={{ haris_firewalld_tailscale_zone }} --set-target=ACCEPT
  register: set_target
  changed_when: set_target.rc == 0

- name: Allow SSH in Tailscale zone
  command: firewall-cmd --permanent --zone={{ haris_firewalld_tailscale_zone }} --add-service=ssh
  register: add_ssh
  changed_when: add_ssh.rc == 0 and 'already enabled' not in add_ssh.stderr
  failed_when: add_ssh.rc != 0 and 'already enabled' not in add_ssh.stderr

- name: Allow Signal K port in Tailscale zone
  command: firewall-cmd --permanent --zone={{ haris_firewalld_tailscale_zone }} --add-port={{ signalk_port }}/tcp
  register: add_signalk
  changed_when: add_signalk.rc == 0 and 'already enabled' not in add_signalk.stderr
  failed_when: add_signalk.rc != 0 and 'already enabled' not in add_signalk.stderr

- name: Allow Kibana port in Tailscale zone
  command: firewall-cmd --permanent --zone={{ haris_firewalld_tailscale_zone }} --add-port={{ kibana_port }}/tcp
  register: add_kibana
  changed_when: add_kibana.rc == 0 and 'already enabled' not in add_kibana.stderr
  failed_when: add_kibana.rc != 0 and 'already enabled' not in add_kibana.stderr

- name: Allow Elasticsearch port in Tailscale zone
  command: firewall-cmd --permanent --zone={{ haris_firewalld_tailscale_zone }} --add-port=9200/tcp
  register: add_elasticsearch
  changed_when: add_elasticsearch.rc == 0 and 'already enabled' not in add_elasticsearch.stderr
  failed_when: add_elasticsearch.rc != 0 and 'already enabled' not in add_elasticsearch.stderr

- name: Set default zone to drop
  command: firewall-cmd --set-default-zone={{ haris_firewalld_default_zone }}
  register: set_default
  changed_when: set_default.rc == 0

- name: Reload firewalld to apply changes
  command: firewall-cmd --reload
  when: create_zone.changed or add_interface.changed or set_target.changed or add_ssh.changed or add_signalk.changed or add_kibana.changed or add_elasticsearch.changed or set_default.changed

- name: Verify firewall configuration
  command: firewall-cmd --zone={{ haris_firewalld_tailscale_zone }} --list-all
  register: zone_status
  changed_when: false

- name: Display zone configuration
  debug:
    var: zone_status.stdout_lines
