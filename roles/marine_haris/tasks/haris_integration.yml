- name: Create source directories
  file:
    path: "{{ item }}"
    state: directory
    owner: "{{ haris_user }}"
    group: "{{ haris_group }}"
  loop:
    - "{{ haris_home }}/src"
    - "{{ haris_home }}/logs"

- name: Deploy Python Data Collector
  copy:
    src: "src/data_aggregator.py" # Assuming you store your python files in roles/marine_haris/files/src/
    dest: "{{ haris_home }}/src/data_aggregator.py"
    owner: "{{ haris_user }}"
    mode: '0755'

- name: Deploy Haris Systemd Service
  template:
    src: harisd.service.j2
    dest: /etc/systemd/system/harisd.service
  notify: Restart Haris Service

- name: Install Filebeat (Lightweight shipper to Logstash)
  apt:
    name: filebeat
    state: present

- name: Configure Filebeat
  template:
    src: filebeat.yml.j2
    dest: /etc/filebeat/filebeat.yml
  notify: Restart Filebeat

- name: Enable Services
  service:
    name: "{{ item }}"
    enabled: yes
    state: started
  loop:
    - harisd
    - filebeat