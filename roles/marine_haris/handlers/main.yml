---
- name: Restart Signal K
  service:
    name: signalk
    state: restarted

- name: Restart Elasticsearch
  service:
    name: elasticsearch
    state: restarted

- name: Restart Logstash
  service:
    name: logstash
    state: restarted

- name: Restart Filebeat
  service:
    name: filebeat
    state: restarted

- name: Restart Haris Service
  service:
    name: harisd
    state: restarted

- name: Restart Network
  command: /sbin/ip link set can0 down && /sbin/ip link set can0 up type can bitrate 250000