# roles/marine_haris/defaults/main.yml

# General Settings
haris_vessel_id: "VESSEL-001"
haris_vessel_name: "Default Vessel"
haris_timezone: "UTC"

# User/Group
haris_user: "haris"
haris_group: "haris"
haris_home: "/opt/marine_haris"

# NMEA Settings
haris_nmea2000_interface: "can0"
haris_nmea0183_port: "/dev/ttyS0"
haris_nmea0183_baud: 4800

# Signal K Settings
signalk_version: "2.6.0"
signalk_port: 3000
signalk_admin_password: "change_me_password" # Override in vault or host_vars

# ELK Stack Settings
elasticsearch_version: "8.x" # Or "7.x" for stability on Pi
elasticsearch_heap_size: "2g" # Adjust based on available RAM (Pi 5 16GB can spare 2-4GB)
kibana_port: 5601
logstash_conf_dir: "/etc/logstash/conf.d"

# Security
elasticsearch_password: "elastic_change_me" # Override this!