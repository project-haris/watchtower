# General Settings
haris_vessel_id: "VESSEL-001"
haris_vessel_name: "Default Vessel"
haris_timezone: "UTC"

# User/Group
haris_user: "haris"
haris_group: "haris"
haris_home: "/opt/marine_haris"

# NMEA Settings
haris_nmea2000_interface: "can0"
haris_nmea0183_port: "/dev/ttyS0"
haris_nmea0183_baud: 4800

# Signal K Settings
signalk_version: "2.6.0"
signalk_port: 3000
signalk_admin_password: "change_me_password"

# ELK Stack Settings
elasticsearch_version: "8.x"
elasticsearch_heap_size: "2g"
elastic_network_host: 0.0.0.0
kibana_server_host: 0.0.0.0
kibana_port: 5601
logstash_conf_dir: "/etc/logstash/conf.d"

# Security
elasticsearch_password: "elastic_change_me"

# Tailscale VPN Settings
tailscale_authkey: ""
tailscale_args: ""
tailscale_tags: []
tailscale_up_skip: false

# Firewalld Settings
haris_firewalld_default_zone: "drop"
haris_firewalld_tailscale_zone: "tailscale"

haris_firewalld_zones:
  - name: "{{ haris_firewalld_tailscale_zone }}"
    target: ACCEPT
    interfaces:
      - tailscale0
    services:
      - ssh
    ports:
      - port: "{{ signalk_port }}"
        protocol: tcp
      - port: "{{ kibana_port }}"
        protocol: tcp
      - port: 9200
        protocol: tcp

haris_firewalld_rules: []
