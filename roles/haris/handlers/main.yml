- name: Restart Signal K
  ansible.builtin.service:
    name: signalk
    state: restarted

- name: Restart Simulator Bridge
  ansible.builtin.service:
    name: simulator-bridge
    state: restarted

- name: Restart Haris Service
  ansible.builtin.service:
    name: harisd
    state: restarted

- name: Restart Filebeat
  ansible.builtin.service:
    name: filebeat
    state: restarted

- name: Bring can0 down
  ansible.builtin.command:
    argv:
      - /sbin/ifdown
      - can0
  listen: Restart Network
  changed_when: false
  failed_when: false

- name: Bring can0 up
  ansible.builtin.command:
    argv:
      - /sbin/ifup
      - can0
  listen: Restart Network
  changed_when: false
