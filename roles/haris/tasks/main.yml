- name: Include System Preparation Tasks
  include_tasks: system_prep.yml
  tags: [setup, system]

- name: Manage Signal K
  include_tasks: signal_k.yml
  tags: [signalk]
  when:
    - haris_manage_signalk_install | bool
      or haris_manage_signalk_service | bool
      or haris_manage_signalk_config | bool

- name: Deploy Project Haris Integration (Parsers & Services)
  include_tasks: haris_integration.yml
  tags: [haris, integration]

- name: Deploy Simulator HTTP Bridge
  include_tasks: simulator_bridge.yml
  tags: [haris, simulator]
  when: haris_simulator_bridge_enabled | bool
