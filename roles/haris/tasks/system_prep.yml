- name: Install required system packages
  apt:
    name:
      - python3
      - python3-pip
      - can-utils
      - ifupdown
      - firewalld
      - apt-transport-https
      - gnupg
    state: present
    update_cache: yes

- name: Install Signal K runtime packages
  apt:
    name:
      - nodejs
      - npm
    state: present
  when: haris_manage_signalk_install | bool

- name: Ensure keyrings directory exists for Filebeat repository
  file:
    path: /usr/share/keyrings
    state: directory
    mode: '0755'
  when: haris_filebeat_enabled | bool

- name: Download Elastic GPG key for Filebeat
  get_url:
    url: https://artifacts.elastic.co/GPG-KEY-elasticsearch
    dest: /usr/share/keyrings/elastic-keyring.asc
    mode: '0644'
  when: haris_filebeat_enabled | bool

- name: Dearmor Elastic GPG key for Filebeat
  command:
    cmd: gpg --dearmor -o /usr/share/keyrings/elastic-archive-keyring.gpg /usr/share/keyrings/elastic-keyring.asc
  args:
    creates: /usr/share/keyrings/elastic-archive-keyring.gpg
  when: haris_filebeat_enabled | bool

- name: Add Elastic apt repository for Filebeat
  apt_repository:
    repo: "deb [signed-by=/usr/share/keyrings/elastic-archive-keyring.gpg arch={{ 'arm64' if ansible_architecture == 'aarch64' else 'amd64' }}] https://artifacts.elastic.co/packages/8.x/apt stable main"
    state: present
    filename: elastic-8.x
    update_cache: true
  when: haris_filebeat_enabled | bool

- name: Install Filebeat
  apt:
    name: filebeat
    state: present
  when: haris_filebeat_enabled | bool

- name: Create Haris group
  group:
    name: "{{ haris_group }}"
    state: present

- name: Create Haris user
  user:
    name: "{{ haris_user }}"
    group: "{{ haris_group }}"
    shell: /bin/bash
    home: "{{ haris_home }}"
    system: yes
    groups: "dialout,gpio,plugdev"
    append: yes

# --- PICAN Hardware Initialization ---

- name: Check if this is a Raspberry Pi
  stat:
    path: /boot/firmware/config.txt
  register: rpi_boot_config_new

- name: Check if this is a Raspberry Pi (Legacy Path)
  stat:
    path: /boot/config.txt
  register: rpi_boot_config_legacy

- name: Determine Boot Config Path
  set_fact:
    boot_config_path: "{{ '/boot/firmware/config.txt' if rpi_boot_config_new.stat.exists else '/boot/config.txt' }}"

- name: Add CAN HAT overlay to boot config
  lineinfile:
    path: "{{ boot_config_path }}"
    line: "{{ item }}"
    state: present
    create: yes
  loop: "{{ haris_can_boot_config_lines }}"
  register: boot_config
  when: haris_manage_can_boot_config | bool

- name: Reboot to load CAN Hardware Overlay
  reboot:
    msg: "Rebooting to initialize CAN hardware..."
    connect_timeout: 5
    reboot_timeout: 300
    pre_reboot_delay: 0
    post_reboot_delay: 30
    test_command: uptime
  when:
    - haris_manage_can_boot_config | bool
    - boot_config.changed

- name: Ensure network interfaces directory exists
  file:
    path: /etc/network/interfaces.d
    state: directory
    mode: '0755'
  when: haris_manage_can_networking | bool

- name: Enable CAN interface networking
  copy:
    dest: /etc/network/interfaces.d/can0
    content: |
      auto can0
      iface can0 inet manual
        pre-up /sbin/ip link set can0 type can bitrate {{ haris_can_bitrate }}
        up /sbin/ifconfig can0 up
        down /sbin/ifconfig can0 down
  notify: Restart Network
  when: haris_manage_can_networking | bool
