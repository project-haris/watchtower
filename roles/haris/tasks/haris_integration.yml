- name: Create source directories
  file:
    path: "{{ item }}"
    state: directory
    owner: "{{ haris_user }}"
    group: "{{ haris_group }}"
  loop:
    - "{{ haris_home }}/src"
    - "{{ haris_home }}/logs"

- name: Deploy Python Data Collector
  copy:
    src: "src/data_aggregator.py" # Assuming you store your python files in roles/haris/files/src/
    dest: "{{ haris_home }}/src/data_aggregator.py"
    owner: "{{ haris_user }}"
    mode: '0755'

- name: Deploy Haris Systemd Service
  template:
    src: harisd.service.j2
    dest: /etc/systemd/system/harisd.service
  notify: Restart Haris Service

- name: Deploy Filebeat configuration
  template:
    src: filebeat.yml.j2
    dest: /etc/filebeat/filebeat.yml
    owner: root
    group: root
    mode: '0644'
  notify: Restart Filebeat
  when: haris_filebeat_enabled | bool

- name: Enable Services
  service:
    name: harisd
    enabled: yes
    state: started

- name: Enable Filebeat service
  service:
    name: filebeat
    enabled: yes
    state: started
  when: haris_filebeat_enabled | bool
