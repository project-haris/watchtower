galaxy_info:
  author: M-SOC Engineering Team
  description: Project Haris edge computing stack for maritime security
  license: MIT
  min_ansible_version: "2.10"
  platforms:
    - name: Debian
      versions:
        - bookworm
    - name: Ubuntu
      versions:
        - jammy
        - noble
  galaxy_tags:
    - maritime
    - security
    - edge-computing
    - raspberry-pi
    - nmea
    - signalk

dependencies:
  - name: tailscale
    src: roles/tailscale
    vars:
      tailscale_authkey: "{{ haris_tailscale_authkey }}"
      tailscale_args: "{{ haris_tailscale_args }}"
      tailscale_tags: "{{ haris_tailscale_tags }}"
      tailscale_up_skip: "{{ haris_tailscale_up_skip }}"
